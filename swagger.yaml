openapi: 3.0.3
info:
  title: Создание распределённой информационной системы передачи архивных документов по страницам - Прикладной уровень
  description: |
    Взаимодействие между Прикладным и Транспортным уровнями. 
  version: 1.0.0

paths:
  /api/receive:
    post:
      tags:
        - HTTP Methods
      summary: "Метод Receive (Транспорт -> Сервер)"
      description: "Принимает результат обработки от транспортного уровня и рассылает его клиентам."
      operationId: "apiReceive"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageResponse'
      responses:
        '200':
          description: "Данные приняты и транслированы в чат"

components:
  schemas:
    MessageResponse:
      type: object
      required: [username, payload]
      properties:
        username:
          type: string
          description: "Имя отправителя или SYSTEM_MOCK"
          example: "SYSTEM_MOCK"
        send_time:
          type: string
          format: date-time
        error:
          type: string
          nullable: true
          description: "Текст ошибки, если она возникла"
          example: "Транспортный уровень недоступен"
        payload:
          type: object
          properties:
            document_id:
              type: string
              example: "About Liberals and Social Democrats"
            page_id:
              type: integer
              example: 2
            file:
              type: string
              description: "или base64"
              example: "/docs/1_5.jpg"